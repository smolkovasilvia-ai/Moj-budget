<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Môj Budget">
<link rel="manifest" href="manifest.json">
<title>Môj Budget</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#151821;--muted:#747b89;--accent:#111827;--line:#e7e9ef;--green:#198754;--red:#d64545;--blue:#4b67ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:92px}
header{padding:20px 18px 8px;position:sticky;top:0;background:rgba(245,246,250,.92);backdrop-filter:blur(14px);z-index:5}
h1{font-size:28px;margin:0 0 3px}.sub{color:var(--muted);font-size:14px}
main{padding:10px 16px}.hero{background:var(--accent);color:white;border-radius:24px;padding:20px;margin:8px 0 16px;box-shadow:0 12px 30px #11182720}
.hero .label{opacity:.7;font-size:13px}.hero .amount{font-size:36px;font-weight:750;margin:3px 0 18px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#ffffff12;border-radius:15px;padding:11px}.stat small{display:block;opacity:.65}.stat b{font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row+.row{margin-top:13px}.cat{display:flex;align-items:center;gap:10px}.icon{width:38px;height:38px;border-radius:12px;background:#f0f2f7;display:grid;place-items:center;font-size:19px}.muted{color:var(--muted)}.small{font-size:12px}
.bar{height:7px;background:#edf0f5;border-radius:9px;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--blue);border-radius:9px}
.section-title{font-size:18px;font-weight:750;margin:20px 3px 10px}
button{border:0;border-radius:14px;padding:12px 15px;font-weight:650;font-size:15px;background:#eef0f5;color:var(--text)}button.primary{background:var(--accent);color:white}.fab{position:fixed;right:18px;bottom:82px;width:58px;height:58px;border-radius:20px;background:var(--accent);color:white;font-size:28px;box-shadow:0 10px 25px #11182740;z-index:10}
nav{position:fixed;bottom:0;left:0;right:0;height:74px;background:rgba(255,255,255,.94);backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:9;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border-radius:0;color:var(--muted);font-size:11px;padding:8px 12px}nav button.active{color:var(--accent)}nav span{display:block;font-size:21px;margin-bottom:2px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:20}.sheet{background:white;border-radius:26px 26px 0 0;padding:20px 18px calc(25px + env(safe-area-inset-bottom));width:100%;max-height:88vh;overflow:auto}.modal.open{display:flex}.sheet h2{margin:0 0 16px}.input{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;font-size:17px;margin:6px 0 12px;background:#fafbfc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.category-btn{text-align:left}.transaction{padding:12px 0;border-bottom:1px solid var(--line)}.negative{color:var(--red)}.positive{color:var(--green)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
</style>
</head>
<body>
<header><h1>Môj Budget</h1><div class="sub" id="month"></div></header>
<main id="app"></main>
<button class="fab" onclick="openAdd()">+</button>
<nav>
<button class="active" onclick="showTab('home',this)"><span>⌂</span>Prehľad</button>
<button onclick="showTab('transactions',this)"><span>↕</span>Výdavky</button>
<button onclick="showTab('budget',this)"><span>◉</span>Rozpočet</button>
<button onclick="showTab('settings',this)"><span>⚙</span>Nastavenia</button>
</nav>

<div class="modal" id="modal"><div class="sheet">
<div class="row"><h2>Nový výdavok</h2><button onclick="closeAdd()">✕</button></div>
<label class="small muted">Suma (€)</label><input class="input" id="amount" type="number" inputmode="decimal" step="0.01" placeholder="0,00">
<label class="small muted">Kategória</label><div class="grid" id="catGrid"></div>
<label class="small muted" style="display:block;margin-top:14px">Poznámka</label><input class="input" id="note" placeholder="napr. obed">
<button class="primary" style="width:100%;margin-top:4px" onclick="saveExpense()">Uložiť výdavok</button>
</div></div>

<script>
const cats=[
["🏠","Bývanie",500],["🍎","Jedlo",300],["📱","Predplatné",70],["🚗","Doprava",100],["🧴","Drogéria",50],
["💄","Kozmetika",70],["👗","Oblečenie",100],["🎉","Zábava",150],["❤️","Vzťahy",100],["✈️","Dovolenka",100],
["🎁","Darčeky",50],["🩺","Zdravie",50],["🛒","Nákupy",80],["💸","Voľné míňanie",100],["💰","Sporenie",400]
];
let data=JSON.parse(localStorage.getItem("mojBudget")||'{"income":2000,"expenses":[]}');
let selectedCat="Jedlo";
const eur=n=>new Intl.NumberFormat("sk-SK",{style:"currency",currency:"EUR"}).format(n);
const monthName=new Intl.DateTimeFormat("sk-SK",{month:"long",year:"numeric"}).format(new Date());
document.getElementById("month").textContent=monthName.charAt(0).toUpperCase()+monthName.slice(1);

function save(){localStorage.setItem("mojBudget",JSON.stringify(data))}
function spent(cat){return data.expenses.filter(x=>x.cat===cat).reduce((s,x)=>s+x.amount,0)}
function totalSpent(){return data.expenses.reduce((s,x)=>s+x.amount,0)}
function renderHome(){
let spentAll=totalSpent(), remain=data.income-spentAll;
document.getElementById("app").innerHTML=`
<div class="hero"><div class="label">Tento mesiac</div><div class="amount">${eur(remain)}</div>
<div class="stats"><div class="stat"><small>Príjem</small><b>${eur(data.income)}</b></div><div class="stat"><small>Minuté</small><b>${eur(spentAll)}</b></div></div></div>
<div class="section-title">Rozpočet</div><div class="card">${cats.map(c=>{
let s=spent(c[1]), p=Math.min(100,c[2]?s/c[2]*100:0);
return `<div class="row"><div class="cat"><div class="icon">${c[0]}</div><div><b>${c[1]}</b><div class="small muted">${eur(s)} z ${eur(c[2])}</div></div></div><b class="${s>c[2]?'negative':''}">${eur(Math.max(0,c[2]-s))}</b></div><div class="bar"><div class="fill" style="width:${p}%"></div></div>`;
}).join("")}</div>
<div class="section-title">Posledné výdavky</div><div class="card">${recent(5)}</div>`;
}
function recent(n){let e=[...data.expenses].reverse().slice(0,n);if(!e.length)return '<div class="empty">Zatiaľ nemáš žiadne výdavky.<br>Pridaj prvý cez +</div>';return e.map(x=>`<div class="row transaction"><div class="cat"><div class="icon">${cats.find(c=>c[1]===x.cat)?.[0]||"•"}</div><div><b>${x.cat}</b><div class="small muted">${x.note||"Bez poznámky"} · ${x.date}</div></div></div><b class="negative">−${eur(x.amount)}</b></div>`).join("")}
function renderTransactions(){
document.getElementById("app").innerHTML=`<div class="section-title">Všetky výdavky</div><div class="card">${recent(100)}</div>`;
}
function renderBudget(){
document.getElementById("app").innerHTML=`<div class="section-title">Mesačné limity</div><div class="card">${cats.map(c=>`<div class="row transaction"><div class="cat"><div class="icon">${c[0]}</div><b>${c[1]}</b></div><b>${eur(c[2])}</b></div>`).join("")}</div>
<div class="card"><b>Príjem</b><input class="input" value="${data.income}" type="number" onchange="data.income=+this.value||0;save();renderBudget()"><div class="small muted">Nastav si mesačný príjem (napr. 2 000 €).</div></div>`;
}
function renderSettings(){
document.getElementById("app").innerHTML=`<div class="section-title">Nastavenia</div>
<div class="card"><b>Bezpečnosť a dáta</b><p class="muted small">Táto prvá verzia ukladá dáta lokálne v telefóne. Žiadne bankové heslo sa nikam neposiela.</p>
<button onclick="exportData()">Exportovať dáta</button> <button onclick="resetData()">Vymazať všetko</button></div>
<div class="card"><b>Bankové účty</b><p class="muted small">Automatická synchronizácia so slovenskými bankami nie je v tejto offline verzii zapnutá. Na bezpečné Open Banking napojenie treba samostatného licencovaného poskytovateľa.</p></div>
<div class="card"><b>Inštalácia na iPhone</b><p class="muted small">V Safari otvor túto aplikáciu → Zdieľať → Pridať na plochu. Potom sa bude správať ako samostatná appka.</p></div>`;
}
function showTab(tab,btn){document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");({home:renderHome,transactions:renderTransactions,budget:renderBudget,settings:renderSettings}[tab])()}
function openAdd(){document.getElementById("catGrid").innerHTML=cats.map(c=>`<button class="category-btn ${c[1]===selectedCat?'primary':''}" onclick="selectedCat='${c[1]}';openAdd()">${c[0]} ${c[1]}</button>`).join("");document.getElementById("modal").classList.add("open")}
function closeAdd(){document.getElementById("modal").classList.remove("open")}
function saveExpense(){let amount=parseFloat(document.getElementById("amount").value);if(!amount||amount<=0)return alert("Zadaj sumu.");data.expenses.push({amount,cat:selectedCat,note:document.getElementById("note").value.trim(),date:new Date().toLocaleDateString("sk-SK")});save();document.getElementById("amount").value="";document.getElementById("note").value="";closeAdd();renderHome()}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="moj-budget-zalohova.json";a.click()}
function resetData(){if(confirm("Naozaj vymazať všetky údaje?")){data={income:2000,expenses:[]};save();renderSettings()}}
renderHome();
</script><script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
</body>
</html>
