<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7c8d8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Môj Budget"><link rel="manifest" href="./manifest.json?v=6"><title>Môj Budget</title>
<style>:root{--pink:#f7c8d8;--pink2:#fff0f5;--bg:#f6f6f9;--line:#e9e9ef;--text:#17171d;--muted:#777985;--red:#d94b59;--orange:#e69a3b;--green:#4c9c72;--dark:#222229}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);padding-bottom:88px}header{position:sticky;top:0;z-index:8;background:#f6f6f9ee;backdrop-filter:blur(14px);padding:17px 16px 8px}h1{margin:0;font-size:27px}.monthnav{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.monthnav button,button{border:0;border-radius:13px;padding:10px 13px;font-weight:650;background:#eeeef3}.monthname{font-weight:750}main{padding:8px 15px}.hero{background:var(--pink);border-radius:24px;padding:19px;margin:6px 0 14px}.hero small{opacity:.7}.amount{font-size:36px;font-weight:800;margin:3px 0 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#ffffff70;border-radius:13px;padding:9px}.stat small{display:block}.stat b{font-size:14px}.insightgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.insight{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.insight small{display:block;color:var(--muted)}.title{font-size:19px;font-weight:800;margin:20px 3px 9px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:14px;margin-bottom:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.catrow,.tx,.manage{padding:10px 0;border-bottom:1px solid var(--line)}.catrow:last-child,.tx:last-child,.manage:last-child{border-bottom:0}.cat{display:flex;align-items:center;gap:10px}.ico{width:38px;height:38px;border-radius:12px;background:var(--pink2);display:grid;place-items:center;font-size:19px;flex:none}.small{font-size:12px}.muted{color:var(--muted)}.red{color:var(--red)!important}.orange{color:var(--orange)!important}.bar{height:6px;background:#eeeef3;border-radius:8px;overflow:hidden;margin:0 0 7px 48px}.fill{height:100%;background:#d7809f}.fill.warn{background:var(--orange)}.fill.over{background:var(--red)}.primary{background:var(--dark);color:#fff}.danger{color:var(--red)}.wide{width:100%}.fab{position:fixed;right:18px;bottom:82px;width:58px;height:58px;border-radius:20px;background:var(--dark);color:#fff;font-size:28px;z-index:10}.checkbox{width:23px;height:23px;border:2px solid #b8bac3;border-radius:7px;display:grid;place-items:center;flex:none}.checkbox.checked{background:#d7a0b5;border-color:#d7a0b5;color:#fff}.savedrow{opacity:.6}nav{position:fixed;bottom:0;left:0;right:0;height:72px;background:#fffffff2;border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:9}nav button{background:none;color:var(--muted);font-size:10px}nav button.active{color:#bd5c80}nav span{display:block;font-size:21px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{width:100%;max-height:91vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:20px 18px 30px}.input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin:5px 0 11px;background:#fafafd}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.notice{background:var(--pink2);padding:11px;border-radius:13px;font-size:12px;color:#6e5260}.empty{text-align:center;padding:24px;color:var(--muted)}canvas{display:block;margin:auto;max-width:290px}.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.pill{font-size:11px;padding:6px 8px}.quick{display:flex;gap:7px;overflow:auto}.quick button{white-space:nowrap}.undo{display:none;position:fixed;left:16px;right:16px;bottom:82px;background:#222229;color:#fff;padding:12px 14px;border-radius:15px;z-index:30}.undo.show{display:flex;justify-content:space-between;align-items:center}.lock{display:none;position:fixed;inset:0;background:var(--bg);z-index:50;align-items:center;justify-content:center;padding:24px}.lock.show{display:flex}.lockbox{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;text-align:center}.pinDots{font-size:32px;letter-spacing:10px;margin:14px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.keypad button{font-size:20px;padding:15px}</style></head><body>
<header><h1>Môj Budget</h1><div class="monthnav"><button onclick="shiftMonth(-1)">‹</button><div id="monthName" class="monthname"></div><button onclick="shiftMonth(1)">›</button></div></header><main id="app"></main><button class="fab" onclick="openExpense()">+</button>
<nav><button class="active" onclick="tab='home';nav(this);render()"><span>⌂</span>Výdavky</button><button onclick="tab='overview';nav(this);render()"><span>◉</span>Prehľad</button><button onclick="tab='budget';nav(this);render()"><span>⚙</span>Rozpočet</button><button onclick="tab='settings';nav(this);render()"><span>☰</span>Nastavenia</button></nav><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="undo" id="undo"><span>Výdavok vymazaný</span><button onclick="undoDelete()">Vrátiť späť</button></div><div class="lock" id="lock"><div class="lockbox"><h2>🔒 Môj Budget</h2><div class="muted small">Zadaj PIN</div><div class="pinDots" id="pinDots">○○○○</div><div class="keypad" id="keypad"></div><div id="pinMsg" class="small red"></div></div></div>
<script>
const D=[["health","🏥","Zdravotka",122,"fixed","spent"],["social","🧾","Sociálka",330,"fixed","saved"],["tax","📄","Daň",100,"fixed","saved"],["netflix","📺","Netflix",12,"fixed","spent"],["spotify","🎵","Spotify",13,"fixed","spent"],["4ka","📱","4ka",23,"fixed","spent"],["rent","🏠","Nájom",485,"fixed","spent"],["internet","🌐","Internet",17,"fixed","spent"],["saving","💰","Šetrenie",300,"fixed","saved"],["multi","🏋️","Multisport",25,"fixed","spent"],["unexpected","🛟","Nečakané výdavky",50,"fixed","saved"],["cloud","☁️","iCloud a Google disk",10,"fixed","spent"],["food","🛒","Potraviny",200,"variable","spent"],["lunch","🍽️","Obedy",100,"variable","spent"],["beauty","💄","Kozmetika",40,"variable","spent"],["drug","🧴","Drogéria do domácnosti",20,"variable","spent"],["pharm","💊","Lekáreň",20,"variable","spent"],["mhd","🚌","Doprava MHD",30,"variable","spent"],["taxi","🚕","Taxíky",20,"variable","spent"],["fun","🎉","Zábava",100,"variable","spent"]].map(x=>({id:x[0],icon:x[1],name:x[2],limit:x[3],type:x[4],bucket:x[5]}));
let s=JSON.parse(localStorage.getItem('mb-v6')||'null')||{defaultIncome:2000,cats:D,months:{},quick:[],pin:''}; if(!s.cats?.length)s.cats=D; let cur=new Date(),tab='home',filter='all',sort='newest',search='',hold,lastDeleted=null,pinBuffer=''; const euro=n=>new Intl.NumberFormat('sk-SK',{style:'currency',currency:'EUR'}).format(n||0),K=()=>cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0'),M=()=>s.months[K()]||(s.months[K()]={income:s.defaultIncome,expenses:[],savedChecks:{}}),C=id=>s.cats.find(c=>c.id===id),save=()=>localStorage.setItem('mb-v6',JSON.stringify(s));
function fixedSpent(){return s.cats.filter(c=>c.type==='fixed'&&c.bucket==='spent').reduce((a,c)=>a+c.limit,0)}function saved(){return s.cats.filter(c=>c.type==='fixed'&&c.bucket==='saved'&&M().savedChecks[c.id]).reduce((a,c)=>a+c.limit,0)}function pending(){return s.cats.filter(c=>c.type==='fixed'&&c.bucket==='saved'&&!M().savedChecks[c.id]).reduce((a,c)=>a+c.limit,0)}function varSpent(){return M().expenses.reduce((a,x)=>a+x.amount,0)}function totalSpent(){return fixedSpent()+varSpent()}function remaining(){return M().income-totalSpent()-saved()}function safeAvailable(){return remaining()-pending()}function spent(id){let c=C(id);return c.type==='fixed'?c.limit:M().expenses.filter(x=>x.cat===id).reduce((a,x)=>a+x.amount,0)}function nav(b){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function shiftMonth(n){cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);render()}function label(){return new Intl.DateTimeFormat('sk-SK',{month:'long',year:'numeric'}).format(cur).replace(/^./,x=>x.toUpperCase())}function daysLeft(){let n=new Date(),last=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();return n.getFullYear()===cur.getFullYear()&&n.getMonth()===cur.getMonth()?Math.max(1,last-n.getDate()+1):last}function render(){monthName.textContent=label();({home,overview,budget,settings}[tab])();save()}
function catRows(t){return s.cats.filter(c=>c.type===t).map(c=>{let sp=spent(c.id),r=c.limit?sp/c.limit:0,sv=c.bucket==='saved',ch=M().savedChecks[c.id],over=r>1,cls=over?'red':r>=.7?'orange':'',bar=over?'over':r>=.7?'warn':'';return `<div class="catrow ${sv&&ch?'savedrow':''}" onclick="detail('${c.id}')" ontouchstart="hold=setTimeout(()=>editCat('${c.id}'),650)" ontouchend="clearTimeout(hold)" oncontextmenu="event.preventDefault();editCat('${c.id}')"><div class="row"><div class="cat">${sv?`<div class="checkbox ${ch?'checked':''}" onclick="event.stopPropagation();toggleSaved('${c.id}')">${ch?'✓':''}</div>`:`<div class="ico">${c.icon}</div>`}<div><b>${c.name}</b><div class="small muted">${sv?(ch?'✓ Odložené':'Čaká na odloženie'):`${euro(sp)} z ${euro(c.limit)}`}</div></div></div><b class="${cls}">${sv?euro(c.limit):(over?'Prekročené o '+euro(sp-c.limit):euro(Math.max(0,c.limit-sp)))}</b></div>${t==='variable'?`<div class="bar"><div class="fill ${bar}" style="width:${Math.min(100,r*100||0)}%"></div></div>`:''}</div>`}).join('')}
function home(){app.innerHTML=`<div class="hero" ontouchstart="hold=setTimeout(editIncome,650)" ontouchend="clearTimeout(hold)" oncontextmenu="event.preventDefault();editIncome()"><small>Zostatok</small><div class="amount">${euro(remaining())}</div><div class="stats"><div class="stat"><small>Príjem</small><b>${euro(M().income)}</b></div><div class="stat"><small>Minuté</small><b>${euro(totalSpent())}</b></div><div class="stat"><small>Odložené</small><b>${euro(saved())}</b></div></div></div><div class="insightgrid"><div class="insight"><small>Bezpečne na deň</small><b>${euro(Math.max(0,safeAvailable()/daysLeft()))}</b></div><div class="insight"><small>Bezpečne na týždeň</small><b>${euro(Math.max(0,safeAvailable()/daysLeft()*7))}</b></div></div>${pending()?`<div class="notice">Rezervujem aj nezaškrtnuté položky na odloženie (${euro(pending())}), aby si ich omylom neminula.</div>`:''}<div class="title">Fixné</div><div class="card">${catRows('fixed')}</div><div class="title">Variabilné</div><div class="card">${catRows('variable')}</div>`}function toggleSaved(id){M().savedChecks[id]=!M().savedChecks[id];render()}
function filtered(){let a=[...M().expenses];if(filter!=='all')a=a.filter(x=>x.cat===filter);if(search.trim()){let q=search.toLowerCase();a=a.filter(x=>(x.note||'').toLowerCase().includes(q)||(C(x.cat)?.name||'').toLowerCase().includes(q))}a.sort(sort==='high'?(a,b)=>b.amount-a.amount:sort==='low'?(a,b)=>a.amount-b.amount:(a,b)=>b.ts-a.ts);return a}function list(){let a=filtered();return a.length?a.map(x=>`<div class="row tx" onclick="editExpense('${x.id}')"><div class="cat"><div class="ico">${C(x.cat)?.icon||'•'}</div><div><b>${C(x.cat)?.name||'Bez kategórie'}</b><div class="small muted">${x.note||'Bez poznámky'} · ${new Date(x.date).toLocaleDateString('sk-SK')}</div></div></div><b class="red">−${euro(x.amount)}</b></div>`).join(''):'<div class="empty">Žiadne výdavky.</div>'}function tops(){let a=[...M().expenses].sort((a,b)=>b.amount-a.amount).slice(0,5);return a.length?a.map((x,i)=>`<div class="row tx"><span>${i+1}. ${x.note||C(x.cat)?.name}</span><b>${euro(x.amount)}</b></div>`).join(''):'<div class="empty">Zatiaľ bez výdavkov.</div>'}function insights(){let vars=s.cats.filter(c=>c.type==='variable'),over=vars.filter(c=>spent(c.id)>c.limit),top=[...vars].sort((a,b)=>spent(b.id)-spent(a.id))[0],big=[...M().expenses].sort((a,b)=>b.amount-a.amount)[0];return [`Variabilne si minula ${euro(varSpent())}.`,over.length?`Limit si prekročila v ${over.length} kategóriách.`:'Zatiaľ neprekračuješ žiadny variabilný limit.',top&&spent(top.id)?`Najviac ide na ${top.name}: ${euro(spent(top.id))}.`:'',big?`Najväčší výdavok: ${big.note||C(big.cat)?.name} – ${euro(big.amount)}.`:''].filter(Boolean)}
function overview(){let v=s.cats.filter(c=>c.type==='variable');app.innerHTML=`<div class="title">Prehľad mesiaca</div><div class="card"><canvas id="pie" width="290" height="290"></canvas><div id="legend" class="legend"></div><div class="row"><b>Variabilné spolu</b><b>${euro(varSpent())}</b></div></div><input class="input" placeholder="Hľadať napr. Lidl, Bolt..." value="${search}" oninput="search=this.value;overview()"><div class="filters"><select onchange="filter=this.value;overview()"><option value="all">Všetky kategórie</option>${v.map(c=>`<option value="${c.id}" ${filter===c.id?'selected':''}>${c.name}</option>`).join('')}</select><select onchange="sort=this.value;overview()"><option value="newest">Najnovšie</option><option value="high" ${sort==='high'?'selected':''}>Najvyššia suma</option><option value="low" ${sort==='low'?'selected':''}>Najnižšia suma</option></select></div>${filter!=='all'||search?`<button onclick="filter='all';search='';overview()">Zrušiť filter</button>`:''}<div class="title">TOP výdavky</div><div class="card">${tops()}</div><div class="title">Mesačné insighty</div><div class="card">${insights().map(x=>`<div class="tx">${x}</div>`).join('')}</div><div class="title">Výdavky</div><div class="card">${list()}</div>`;pie()}function pie(){let cv=document.getElementById('pie');if(!cv)return;let ctx=cv.getContext('2d'),v=s.cats.filter(c=>c.type==='variable'),vals=v.map(c=>spent(c.id)),tot=vals.reduce((a,b)=>a+b,0);ctx.clearRect(0,0,290,290);if(!tot){ctx.fillStyle='#777';ctx.textAlign='center';ctx.fillText('Zatiaľ bez výdavkov',145,145);return}let st=-Math.PI/2,colors=['#d77e9e','#e8a5bb','#b97f9d','#f0c0cf','#a76d8a','#e39ab1','#c88ca4','#f3ced9'];vals.forEach((x,i)=>{if(!x)return;let en=st+x/tot*Math.PI*2;ctx.beginPath();ctx.moveTo(145,145);ctx.arc(145,145,110,st,en);ctx.fillStyle=colors[i%colors.length];ctx.fill();st=en});legend.innerHTML=v.filter(c=>spent(c.id)>0).map(c=>`<button class="pill" onclick="filter='${c.id}';overview()">${c.name}</button>`).join('')}
function budget(){app.innerHTML=`<div class="title">Správa rozpočtu</div><div class="notice">Zmeny sa prejavia v celej aplikácii.</div><div class="title">Fixné</div><div class="card">${manage('fixed')}</div><div class="title">Variabilné</div><div class="card">${manage('variable')}</div><button class="primary wide" onclick="newCat()">+ Pridať kategóriu</button>`}function manage(t){return s.cats.filter(c=>c.type===t).map(c=>`<div class="row manage" onclick="editCat('${c.id}')"><div class="cat"><div class="ico">${c.icon}</div><b>${c.name}</b></div><b>${euro(c.limit)} ›</b></div>`).join('')}
function settings(){app.innerHTML=`<div class="title">Nastavenia</div><div class="card"><b>Predvolený mesačný príjem</b><input class="input" type="number" value="${s.defaultIncome}" onchange="s.defaultIncome=+this.value||2000;save()"><div class="small muted">Nové mesiace začínajú touto sumou.</div></div><div class="card"><b>PIN zámok</b><p class="small muted">${s.pin?'PIN je zapnutý.':'PIN nie je nastavený.'}</p><button onclick="setPin()">${s.pin?'Zmeniť PIN':'Nastaviť PIN'}</button> ${s.pin?'<button onclick="removePin()">Vypnúť PIN</button>':''}</div><div class="card"><b>Záloha</b><button onclick="backup()">Exportovať zálohu</button><input id="importFile" type="file" accept="application/json" style="display:none" onchange="restore(event)"><button onclick="importFile.click()">Importovať zálohu</button></div>`}
function modal(x){sheet.innerHTML=x;document.getElementById('modal').classList.add('open')}function closeM(){document.getElementById('modal').classList.remove('open')}function quickBtns(){return (s.quick||[]).slice(0,6).map(q=>`<button onclick="closeM();openExpense('${q.cat}','${q.note.replace(/'/g,"\\'")}')">${q.note}</button>`).join('')}function openExpense(pc='',pn=''){let v=s.cats.filter(c=>c.type==='variable'),d=K()+'-'+String(Math.min(new Date().getDate(),28)).padStart(2,'0');modal.innerHTML;document.getElementById('sheet').innerHTML=`<div class="row"><h2>Nový výdavok</h2><button onclick="closeM()">✕</button></div>${quickBtns()?`<div class="quick">${quickBtns()}</div>`:''}<input id="ea" class="input" type="number" step=".01" placeholder="Suma"><select id="ec">${v.map(c=>`<option value="${c.id}" ${c.id===pc?'selected':''}>${c.icon} ${c.name}</option>`).join('')}</select><input id="ed" class="input" type="date" value="${d}"><input id="en" class="input" value="${pn}" placeholder="Poznámka"><button class="primary wide" onclick="saveExpense()">Uložiť</button>`;document.getElementById('modal').classList.add('open')}function remember(n,c){if(!n)return;s.quick=s.quick||[];let q=s.quick.find(x=>x.note.toLowerCase()===n.toLowerCase());if(q){q.cat=c;q.count=(q.count||1)+1}else s.quick.push({note:n,cat:c,count:1});s.quick.sort((a,b)=>(b.count||0)-(a.count||0));s.quick=s.quick.slice(0,10)}function saveExpense(){let a=+ea.value;if(!a)return alert('Zadaj sumu.');let n=en.value.trim();M().expenses.push({id:'e'+Date.now(),amount:a,cat:ec.value,date:ed.value,note:n,ts:new Date(ed.value).getTime()+Date.now()%86400000});remember(n,ec.value);save();closeM();render()}
function detail(id){let c=C(id),it=M().expenses.filter(x=>x.cat===id).sort((a,b)=>b.ts-a.ts);modal.innerHTML;sheet.innerHTML=`<div class="row"><h2>${c.icon} ${c.name}</h2><button onclick="closeM()">✕</button></div><div class="card"><div class="row"><span>Limit</span><b>${euro(c.limit)}</b></div><div class="row"><span>${c.bucket==='saved'?'Odložené':'Minuté'}</span><b>${c.bucket==='saved'?(M().savedChecks[id]?euro(c.limit):euro(0)):euro(spent(id))}</b></div></div>${c.type==='fixed'?`<div class="notice">${c.bucket==='saved'?(M().savedChecks[id]?'Položka je odložená.':'Položka ešte čaká na odloženie.'):'Automaticky počítané ako uhradené.'}</div>`:it.length?it.map(x=>`<div class="row tx" onclick="editExpense('${x.id}')"><div><b>${new Date(x.date).toLocaleDateString('sk-SK')}</b><div class="small muted">${x.note||'Bez poznámky'}</div></div><b>${euro(x.amount)} ›</b></div>`).join(''):'<div class="empty">Žiadne záznamy.</div>'}`;document.getElementById('modal').classList.add('open')}
function editExpense(id){let x=M().expenses.find(y=>y.id===id);sheet.innerHTML=`<div class="row"><h2>Upraviť výdavok</h2><button onclick="closeM()">✕</button></div><input id="xa" class="input" type="number" value="${x.amount}"><select id="xc">${s.cats.filter(c=>c.type==='variable').map(c=>`<option value="${c.id}" ${c.id===x.cat?'selected':''}>${c.name}</option>`).join('')}</select><input id="xd" class="input" type="date" value="${x.date}"><input id="xn" class="input" value="${x.note||''}"><button class="primary" onclick="updateExpense('${id}')">Uložiť</button> <button class="danger" onclick="deleteExpense('${id}')">Vymazať</button>`;document.getElementById('modal').classList.add('open')}function updateExpense(id){let x=M().expenses.find(y=>y.id===id);x.amount=+xa.value;x.cat=xc.value;x.date=xd.value;x.note=xn.value;x.ts=new Date(x.date).getTime();remember(x.note,x.cat);save();closeM();render()}function deleteExpense(id){let i=M().expenses.findIndex(x=>x.id===id);if(i<0)return;if(confirm('Naozaj vymazať?')){lastDeleted={month:K(),item:M().expenses[i],index:i};M().expenses.splice(i,1);save();closeM();render();undo.classList.add('show');setTimeout(()=>undo.classList.remove('show'),5000)}}function undoDelete(){if(!lastDeleted)return;let m=s.months[lastDeleted.month];m.expenses.splice(lastDeleted.index,0,lastDeleted.item);lastDeleted=null;save();undo.classList.remove('show');render()}
function editIncome(){sheet.innerHTML=`<div class="row"><h2>Upraviť príjem</h2><button onclick="closeM()">✕</button></div><div class="notice">Len pre ${label()}.</div><input id="inc" class="input" type="number" value="${M().income}"><button class="primary wide" onclick="M().income=+inc.value||0;save();closeM();render()">Uložiť</button>`;document.getElementById('modal').classList.add('open')}function editCat(id){let c=C(id);sheet.innerHTML=`<div class="row"><h2>Upraviť kategóriu</h2><button onclick="closeM()">✕</button></div><input id="cn" class="input" value="${c.name}"><input id="ci" class="input" value="${c.icon}"><input id="cl" class="input" type="number" value="${c.limit}"><select id="ct"><option value="fixed" ${c.type==='fixed'?'selected':''}>Fixná</option><option value="variable" ${c.type==='variable'?'selected':''}>Variabilná</option></select><select id="cb"><option value="spent" ${c.bucket==='spent'?'selected':''}>Minuté</option><option value="saved" ${c.bucket==='saved'?'selected':''}>Odložené</option></select><button class="primary" onclick="saveCat('${id}')">Uložiť</button> <button class="danger" onclick="removeCat('${id}')">Vymazať</button>`;document.getElementById('modal').classList.add('open')}function saveCat(id){let c=C(id);c.name=cn.value||c.name;c.icon=ci.value||'•';c.limit=+cl.value||0;c.type=ct.value;c.bucket=cb.value;save();closeM();render()}function newCat(){sheet.innerHTML=`<div class="row"><h2>Nová kategória</h2><button onclick="closeM()">✕</button></div><input id="nn" class="input" placeholder="Názov"><input id="ni" class="input" placeholder="Emoji"><input id="nl" class="input" type="number" placeholder="Limit"><select id="nt"><option value="variable">Variabilná</option><option value="fixed">Fixná</option></select><select id="nb"><option value="spent">Minuté</option><option value="saved">Odložené</option></select><button class="primary wide" onclick="addCat()">Pridať</button>`;document.getElementById('modal').classList.add('open')}function addCat(){if(!nn.value.trim())return alert('Zadaj názov.');s.cats.push({id:'c'+Date.now(),name:nn.value.trim(),icon:ni.value||'•',limit:+nl.value||0,type:nt.value,bucket:nb.value});save();closeM();render()}function removeCat(id){if(confirm('Naozaj vymazať kategóriu?')){s.cats=s.cats.filter(c=>c.id!==id);save();closeM();render()}}
function backup(){let b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='moj-budget-zaloha.json';a.click()}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(!o.cats||!o.months)throw 0;if(confirm('Import nahradí aktuálne dáta. Pokračovať?')){s=o;save();render();alert('Záloha obnovená.')}}catch(_){alert('Neplatná záloha.')}};r.readAsText(f)}function setPin(){let p=prompt('Zadaj nový 4-miestny PIN:');if(!p)return;if(!/^\d{4}$/.test(p))return alert('PIN musí mať 4 číslice.');s.pin=p;save();alert('PIN nastavený.')}function removePin(){if(confirm('Vypnúť PIN?')){s.pin='';save()}}function keypadBuild(){keypad.innerHTML=[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button onclick="pinKey('${k}')">${k}</button>`).join('')}function pinKey(k){if(k==='⌫')pinBuffer=pinBuffer.slice(0,-1);else if(k==='✓'){if(pinBuffer===s.pin){lock.classList.remove('show');pinMsg.textContent='';pinBuffer=''}else{pinMsg.textContent='Nesprávny PIN';pinBuffer=''}}else if(pinBuffer.length<4)pinBuffer+=k;pinDots.textContent='●'.repeat(pinBuffer.length)+'○'.repeat(4-pinBuffer.length)}function startLock(){if(s.pin){keypadBuild();pinDots.textContent='○○○○';lock.classList.add('show')}}document.addEventListener('visibilitychange',()=>{if(!document.hidden)startLock()});render();startLock();
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js?v=6');</script></body></html>
