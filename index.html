<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7c8d8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Môj Budget"><link rel="manifest" href="./manifest.json"><title>Môj Budget</title>
<style>
:root{--pink:#f7c8d8;--pale:#fff1f6;--bg:#f6f6f9;--line:#e8e8ee;--text:#19191f;--muted:#777985;--red:#cf4b59}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);padding-bottom:82px}header{position:sticky;top:0;z-index:5;background:#f6f6f9ee;backdrop-filter:blur(12px);padding:18px 16px 8px}h1{margin:0;font-size:27px}.months{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.months button,button{border:0;border-radius:12px;padding:10px 13px;font-weight:650;background:#eeeef3}.month{font-weight:750}main{padding:8px 15px}.hero{background:var(--pink);border-radius:24px;padding:20px;margin-bottom:16px}.hero small{opacity:.7}.balance{font-size:36px;font-weight:800;margin:3px 0 15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#ffffff70;border-radius:13px;padding:9px}.stat small{display:block}.stat b{font-size:14px}.title{font-size:19px;font-weight:800;margin:19px 3px 9px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:14px;margin-bottom:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.catrow,.tx,.manage{padding:10px 0;border-bottom:1px solid var(--line)}.catrow:last-child,.tx:last-child,.manage:last-child{border-bottom:0}.cat{display:flex;align-items:center;gap:10px}.ico{width:38px;height:38px;border-radius:12px;background:var(--pale);display:grid;place-items:center;font-size:19px}.small{font-size:12px}.muted{color:var(--muted)}.red{color:var(--red)}.bar{height:6px;background:#eeeef3;border-radius:8px;overflow:hidden;margin:0 0 7px 48px}.fill{height:100%;background:#d67c9d}.primary{background:#222229;color:#fff}.wide{width:100%}.fab{position:fixed;right:18px;bottom:78px;width:58px;height:58px;border-radius:20px;background:#222229;color:#fff;font-size:28px;z-index:9}nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:#fffffff2;border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:8}nav button{background:none;color:var(--muted);font-size:10px}nav button.active{color:#bd5c80}nav span{display:block;font-size:21px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:25px 25px 0 0;padding:20px 18px 30px}.input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin:5px 0 11px;background:#fafafd}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.notice{background:var(--pale);padding:11px;border-radius:12px;font-size:12px;color:#6d5260}.empty{text-align:center;padding:22px;color:var(--muted)}canvas{display:block;margin:auto;max-width:290px}.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.pill{font-size:11px;padding:6px 8px}
</style></head><body><header><h1>Môj Budget</h1><div class="months"><button onclick="shift(-1)">‹</button><div id="month" class="month"></div><button onclick="shift(1)">›</button></div></header><main id="app"></main><button class="fab" onclick="addExpense()">+</button>
<nav><button class="active" onclick="go('home',this)"><span>⌂</span>Prehľad</button><button onclick="go('expenses',this)"><span>↕</span>Výdavky</button><button onclick="go('budget',this)"><span>◉</span>Rozpočet</button><button onclick="go('settings',this)"><span>⚙</span>Nastavenia</button></nav><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const D=[["health","🏥","Zdravotka",122,"fixed","spent"],["social","🧾","Sociálka",330,"fixed","saved"],["tax","📄","Daň",100,"fixed","saved"],["netflix","📺","Netflix",12,"fixed","spent"],["spotify","🎵","Spotify",13,"fixed","spent"],["4ka","📱","4ka",23,"fixed","spent"],["rent","🏠","Nájom",485,"fixed","spent"],["internet","🌐","Internet",17,"fixed","spent"],["saving","💰","Šetrenie",300,"fixed","saved"],["multi","🏋️","Multisport",25,"fixed","spent"],["unexpected","🛟","Nečakané výdavky",50,"fixed","saved"],["cloud","☁️","iCloud a Google disk",10,"fixed","spent"],["food","🛒","Potraviny",200,"variable","spent"],["lunch","🍽️","Obedy",100,"variable","spent"],["beauty","💄","Kozmetika",40,"variable","spent"],["drug","🧴","Drogéria do domácnosti",20,"variable","spent"],["pharm","💊","Lekáreň",20,"variable","spent"],["mhd","🚌","Doprava MHD",30,"variable","spent"],["taxi","🚕","Taxíky",20,"variable","spent"],["fun","🎉","Zábava",100,"variable","spent"]].map(x=>({id:x[0],icon:x[1],name:x[2],limit:x[3],type:x[4],bucket:x[5]}));
let s=JSON.parse(localStorage.getItem("mb-v4")||"null")||{income:2000,cats:D,months:{}};
let cur=new Date(),tab="home",filter="all",sort="newest",hold;
const appEl=document.getElementById("app"), monthEl=document.getElementById("month"), sheetEl=document.getElementById("sheet"), modalNode=document.getElementById("modal");
const euro=n=>new Intl.NumberFormat("sk-SK",{style:"currency",currency:"EUR"}).format(n||0),K=()=>cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0"),M=()=>s.months[K()]||(s.months[K()]={expenses:[]}),C=id=>s.cats.find(c=>c.id===id),save=()=>localStorage.setItem("mb-v4",JSON.stringify(s));
function fixedSpent(){return s.cats.filter(c=>c.type==="fixed"&&c.bucket==="spent").reduce((a,c)=>a+c.limit,0)}function saved(){return s.cats.filter(c=>c.type==="fixed"&&c.bucket==="saved").reduce((a,c)=>a+c.limit,0)}function varSpent(){return M().expenses.reduce((a,x)=>a+x.amount,0)}function spent(id){let c=C(id);return c.type==="fixed"?c.limit:M().expenses.filter(x=>x.cat===id).reduce((a,x)=>a+x.amount,0)}function shift(n){cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);render()}function go(t,b){tab=t;document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}
function render(){monthEl.textContent=new Intl.DateTimeFormat("sk-SK",{month:"long",year:"numeric"}).format(cur).replace(/^./,x=>x.toUpperCase());({home,expenses,budget,settings}[tab])();save()}
function rows(type){return s.cats.filter(c=>c.type===type).map(c=>`<div class="catrow" onclick="detail('${c.id}')" ontouchstart="hold=setTimeout(()=>editCat('${c.id}'),650)" ontouchend="clearTimeout(hold)" oncontextmenu="event.preventDefault();editCat('${c.id}')"><div class="row"><div class="cat"><div class="ico">${c.icon}</div><div><b>${c.name}</b><div class="small muted">${c.bucket==="saved"?"Odložené":euro(spent(c.id))+" z "+euro(c.limit)}</div></div></div><b>${c.bucket==="saved"?euro(c.limit):euro(Math.max(0,c.limit-spent(c.id)))}</b></div>${type==="variable"?`<div class="bar"><div class="fill" style="width:${Math.min(100,spent(c.id)/c.limit*100||0)}%"></div></div>`:""}</div>`).join("")}
function home(){let min=fixedSpent()+varSpent(),bal=s.income-min-saved();appEl.innerHTML=`<div class="hero"><small>Zostatok</small><div class="balance">${euro(bal)}</div><div class="stats"><div class="stat"><small>Príjem</small><b>${euro(s.income)}</b></div><div class="stat"><small>Minuté</small><b>${euro(min)}</b></div><div class="stat"><small>Odložené</small><b>${euro(saved())}</b></div></div></div><div class="title">Fixné</div><div class="card">${rows("fixed")}</div><div class="title">Variabilné</div><div class="card">${rows("variable")}</div>`}
function list(){let a=[...M().expenses];if(filter!=="all")a=a.filter(x=>x.cat===filter);a.sort(sort==="high"?(a,b)=>b.amount-a.amount:sort==="low"?(a,b)=>a.amount-b.amount:(a,b)=>b.ts-a.ts);return a.length?a.map(x=>`<div class="row tx" onclick="editExpense('${x.id}')"><div class="cat"><div class="ico">${C(x.cat)?.icon||"•"}</div><div><b>${C(x.cat)?.name||"Bez kategórie"}</b><div class="small muted">${x.note||"Bez poznámky"} · ${new Date(x.date).toLocaleDateString("sk-SK")}</div></div></div><b class="red">−${euro(x.amount)}</b></div>`).join(""):`<div class="empty">Žiadne výdavky.</div>`}
function expenses(){let v=s.cats.filter(c=>c.type==="variable");appEl.innerHTML=`<div class="title">Variabilné výdavky</div><div class="card"><canvas id="pie" width="290" height="290" onclick="pieClick(event)"></canvas><div id="legend" class="legend"></div><div class="row"><b>Spolu</b><b>${euro(varSpent())}</b></div></div><div class="filters"><select onchange="filter=this.value;expenses()"><option value="all">Všetky kategórie</option>${v.map(c=>`<option value="${c.id}" ${filter===c.id?"selected":""}>${c.name}</option>`).join("")}</select><select onchange="sort=this.value;expenses()"><option value="newest" ${sort==="newest"?"selected":""}>Najnovšie</option><option value="high" ${sort==="high"?"selected":""}>Najvyššia suma</option><option value="low" ${sort==="low"?"selected":""}>Najnižšia suma</option></select></div>${filter!=="all"?`<button onclick="filter='all';expenses()">Zrušiť filter</button>`:""}<div class="card">${list()}</div>`;pie()}
function pie(){let cv=document.getElementById("pie"),ctx=cv.getContext("2d"),v=s.cats.filter(c=>c.type==="variable"),vals=v.map(c=>spent(c.id)),tot=vals.reduce((a,b)=>a+b,0);ctx.clearRect(0,0,290,290);if(!tot){ctx.fillStyle="#777";ctx.textAlign="center";ctx.fillText("Zatiaľ bez výdavkov",145,145);return}let st=-Math.PI/2,colors=["#d77e9e","#e8a5bb","#b97f9d","#f0c0cf","#a76d8a","#e39ab1","#c88ca4","#f3ced9"];vals.forEach((x,i)=>{if(!x)return;let en=st+x/tot*Math.PI*2;ctx.beginPath();ctx.moveTo(145,145);ctx.arc(145,145,110,st,en);ctx.fillStyle=colors[i%colors.length];ctx.fill();st=en});document.getElementById("legend").innerHTML=v.filter(c=>spent(c.id)>0).map(c=>`<button class="pill" onclick="filter='${c.id}';expenses()">${c.name}</button>`).join("")}

function pieClick(ev){
  let cv=document.getElementById("pie"),rect=cv.getBoundingClientRect(),scaleX=cv.width/rect.width,scaleY=cv.height/rect.height;
  let x=(ev.clientX-rect.left)*scaleX-145,y=(ev.clientY-rect.top)*scaleY-145,r=Math.sqrt(x*x+y*y);
  if(r>110)return;
  let angle=Math.atan2(y,x)+Math.PI/2;if(angle<0)angle+=Math.PI*2;
  let v=s.cats.filter(c=>c.type==="variable"),vals=v.map(c=>spent(c.id)),tot=vals.reduce((a,b)=>a+b,0);
  if(!tot)return;
  let acc=0;
  for(let i=0;i<v.length;i++){let frac=vals[i]/tot*Math.PI*2;if(angle>=acc&&angle<acc+frac){if(vals[i]>0){filter=v[i].id;expenses();}return}acc+=frac;}
}
function budget(){appEl.innerHTML=`<div class="title">Správa rozpočtu</div><div class="notice">Úpravy sa automaticky prejavia v celej aplikácii.</div><div class="title">Fixné</div><div class="card">${manage("fixed")}</div><div class="title">Variabilné</div><div class="card">${manage("variable")}</div><button class="primary wide" onclick="newCat()">+ Pridať kategóriu</button>`}function manage(t){return s.cats.filter(c=>c.type===t).map(c=>`<div class="row manage" onclick="editCat('${c.id}')"><div class="cat"><div class="ico">${c.icon}</div><b>${c.name}</b></div><b>${euro(c.limit)} ›</b></div>`).join("")}
function settings(){appEl.innerHTML=`<div class="title">Nastavenia</div><div class="card"><b>Mesačný príjem</b><input class="input" type="number" value="${s.income}" onchange="s.income=+this.value||0;save()"></div><div class="card"><b>Záloha</b><p class="small muted">Dáta sú uložené lokálne v Safari.</p><button onclick="backup()">Exportovať zálohu</button></div>`}
function modal(x){sheetEl.innerHTML=x;modalNode.classList.add("open")}function closeM(){modalNode.classList.remove("open")}
function addExpense(){let v=s.cats.filter(c=>c.type==="variable"),today=new Date(),d=K()+"-"+String(Math.min(today.getDate(),28)).padStart(2,"0");modal(`<div class="row"><h2>Nový výdavok</h2><button onclick="closeM()">✕</button></div><input id="a" class="input" type="number" step=".01" placeholder="Suma"><select id="c">${v.map(x=>`<option value="${x.id}">${x.icon} ${x.name}</option>`)}</select><input id="d" class="input" type="date" value="${d}"><input id="n" class="input" placeholder="Poznámka"><button class="primary wide" onclick="saveExpense()">Uložiť</button>`)}function saveExpense(){let a=+document.getElementById("a").value;if(!a)return alert("Zadaj sumu.");let d=document.getElementById("d").value;M().expenses.push({id:"e"+Date.now(),amount:a,cat:document.getElementById("c").value,date:d,note:document.getElementById("n").value,ts:new Date(d).getTime()+Date.now()%86400000});save();closeM();render()}
function detail(id){
  let c=C(id);
  if(!c)return;
  let it=M().expenses.filter(x=>x.cat===id).sort((a,b)=>b.ts-a.ts);
  let body="";
  if(c.type==="fixed"){
    body=`<div class="notice">Táto fixná položka sa automaticky započítava raz za mesiac.</div>`;
  }else if(it.length){
    body=it.map(x=>`<div class="row tx" onclick="editExpense('${x.id}')"><div><b>${new Date(x.date).toLocaleDateString("sk-SK")}</b><div class="small muted">${escapeHtml(x.note||"Bez poznámky")}</div></div><b>${euro(x.amount)} ›</b></div>`).join("");
  }else{
    body=`<div class="empty">Žiadne záznamy.</div>`;
  }
  let extra=c.type==="variable"?`<div class="row"><span>Zostáva</span><b>${euro(Math.max(0,c.limit-spent(id)))}</b></div>`:"";
  modal(`<div class="row"><h2>${c.icon} ${escapeHtml(c.name)}</h2><button onclick="closeM()">✕</button></div><div class="card"><div class="row"><span>Limit</span><b>${euro(c.limit)}</b></div><div class="row"><span>${c.bucket==="saved"?"Odložené":"Minuté"}</span><b>${euro(spent(id))}</b></div>${extra}</div>${body}`);
}
function editExpense(id){let x=M().expenses.find(y=>y.id===id);modal(`<div class="row"><h2>Upraviť výdavok</h2><button onclick="closeM()">✕</button></div><input id="ea" class="input" type="number" value="${x.amount}"><select id="ec">${s.cats.filter(c=>c.type==="variable").map(c=>`<option value="${c.id}" ${c.id===x.cat?"selected":""}>${c.name}</option>`)}</select><input id="ed" class="input" type="date" value="${x.date}"><input id="en" class="input" value="${x.note||""}"><button class="primary" onclick="updateExpense('${id}')">Uložiť</button> <button class="red" onclick="delExpense('${id}')">Vymazať</button>`)}function updateExpense(id){let x=M().expenses.find(y=>y.id===id);x.amount=+document.getElementById("ea").value;x.cat=document.getElementById("ec").value;x.date=document.getElementById("ed").value;x.note=document.getElementById("en").value;x.ts=new Date(x.date).getTime();save();closeM();render()}function delExpense(id){if(confirm("Naozaj chceš tento výdavok vymazať?")){M().expenses=M().expenses.filter(x=>x.id!==id);save();closeM();render()}}
function editCat(id){let c=C(id);modal(`<div class="row"><h2>Upraviť kategóriu</h2><button onclick="closeM()">✕</button></div><input id="cn" class="input" value="${c.name}"><input id="ci" class="input" value="${c.icon}"><input id="cl" class="input" type="number" value="${c.limit}"><select id="ct"><option value="fixed" ${c.type==="fixed"?"selected":""}>Fixná</option><option value="variable" ${c.type==="variable"?"selected":""}>Variabilná</option></select><select id="cb"><option value="spent" ${c.bucket==="spent"?"selected":""}>Minuté</option><option value="saved" ${c.bucket==="saved"?"selected":""}>Odložené</option></select><button class="primary" onclick="saveCat('${id}')">Uložiť</button> <button class="red" onclick="removeCat('${id}')">Vymazať</button>`)}function saveCat(id){let c=C(id);c.name=document.getElementById("cn").value||c.name;c.icon=document.getElementById("ci").value||"•";c.limit=+document.getElementById("cl").value||0;c.type=document.getElementById("ct").value;c.bucket=document.getElementById("cb").value;save();closeM();render()}
function newCat(){modal(`<div class="row"><h2>Nová kategória</h2><button onclick="closeM()">✕</button></div><input id="nn" class="input" placeholder="Názov"><input id="ni" class="input" placeholder="Emoji"><input id="nl" class="input" type="number" placeholder="Limit"><select id="nt"><option value="variable">Variabilná</option><option value="fixed">Fixná</option></select><select id="nb"><option value="spent">Minuté</option><option value="saved">Odložené</option></select><button class="primary wide" onclick="addCat()">Pridať</button>`)}function addCat(){let nn=document.getElementById("nn"),ni=document.getElementById("ni"),nl=document.getElementById("nl"),nt=document.getElementById("nt"),nb=document.getElementById("nb");if(!nn.value.trim())return alert("Zadaj názov.");s.cats.push({id:"c"+Date.now(),name:nn.value.trim(),icon:ni.value||"•",limit:+nl.value||0,type:nt.value,bucket:nb.value});save();closeM();render()}
function removeCat(id){let used=Object.values(s.months).some(m=>m.expenses&&m.expenses.some(x=>x.cat===id));if(used){let name=prompt("Kategória má históriu. Napíš názov kategórie, do ktorej ju chceš presunúť, alebo PONECHAŤ.");if(name===null)return;if(name.toUpperCase()!=="PONECHAŤ"){let t=s.cats.find(c=>c.id!==id&&c.name.toLowerCase()===name.toLowerCase());if(!t)return alert("Kategóriu som nenašla.");Object.values(s.months).forEach(m=>(m.expenses||[]).forEach(x=>{if(x.cat===id)x.cat=t.id}))}}if(confirm("Naozaj vymazať kategóriu?")){s.cats=s.cats.filter(c=>c.id!==id);save();closeM();render()}}
function escapeHtml(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}function backup(){let b=new Blob([JSON.stringify(s,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="moj-budget-zaloha.json";a.click()}render();
</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");</script></body></html>
