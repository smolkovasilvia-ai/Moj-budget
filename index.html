function saveExpense(){let a=+$('ea').value;if(!a||a<=0)return alert('Zadaj platnú sumu.');let n=$('en').value.trim(),date=$('ed').value,key=date.slice(0,7),tags=selectedTags(),split=$('splitToggle')?.checked,mood=$('moodPick')?.dataset.value||'',now=new Date(),tm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');if(split){let rows=[...document.querySelectorAll('.splitRow')].map(r=>({amount:+r.querySelector('.splitAmount').value||0,cat:r.querySelector('.splitCat').value})).filter(x=>x.amount>0);if(rows.length<2)return alert('Pri rozdelení pridaj aspoň dve časti.');let sum=rows.reduce((q,x)=>q+x.amount,0);if(Math.abs(sum-a)>.009)return alert('Súčet rozdelených častí musí byť '+a.toFixed(2)+' €. Aktuálne: '+sum.toFixed(2)+' €.');let gid='g'+Date.now();rows.forEach((r,i)=>M(key).expenses.push({id:'e'+Date.now()+i,amount:r.amount,cat:r.cat,subcat:'',date,note:n,tags:[...tags],mood,time:tm,splitGroup:gid,ts:new Date(date+'T12:00').getTime()+i}));remember(n,rows[0].cat,'',a)}else{let sub=$('es')?.value||'',cat=$('ec').value;M(key).expenses.push({id:'e'+Date.now(),amount:a,cat,subcat:sub,date,note:n,tags,mood,time:tm,ts:new Date(date+'T12:00').getTime()+Date.now()%1000});remember(n,cat,sub,a)}save();closeM();if(key!==K()){cur=new Date(+key.slice(0,4),+key.slice(5)-1,1)}render();toastMsg(split?'Výdavok rozdelený a uložený':'Výdavok uložený')}

function updateExpense(id,oldKey){let f=findExpense(id,oldKey);if(!f)return;let x=f.x,a=+$('xa').value;if(!a||a<=0)return alert('Zadaj platnú sumu.');let newDate=$('xd').value,newKey=newDate.slice(0,7);Object.assign(x,{amount:a,cat:$('xc').value,subcat:$('xs')?.value||'',date:newDate,note:$('xn').value.trim(),tags:selectedTags(),mood:$('moodPick')?.dataset.value||'',ts:new Date(newDate+'T12:00').getTime()+Date.now()%1000});if(newKey!==oldKey){M(oldKey).expenses=M(oldKey).expenses.filter(y=>y.id!==id);M(newKey).expenses.push(x)}remember(x.note,x.cat,x.subcat,x.amount);save();closeM();render();toastMsg('Výdavok upravený')}
function spendingTriggers(){let all=[];Object.values(s.months).forEach(m=>(m.expenses||[]).forEach(x=>all.push(x)));if(all.length<8)return [{icon:'🧠',title:'Zbieram dáta',text:'Po pár ďalších výdavkoch ti ukážem tvoje spending patterns.'}];let out=[],byDow=Array(7).fill(0),cntDow=Array(7).fill(0);all.forEach(x=>{let d=new Date(x.date+'T12:00').getDay();byDow[d]+=x.amount;cntDow[d]++});let avg=all.reduce((a,x)=>a+x.amount,0)/all.length,idx=byDow.map((v,i)=>cntDow[i]?v/cntDow[i]:0).reduce((bi,v,i,a)=>v>a[bi]?i:bi,0),names=['nedeľu','pondelok','utorok','stredu','štvrtok','piatok','sobotu'];if(cntDow[idx]>=2)out.push({icon:'📅',title:'Deň v týždni',text:`V ${names[idx]} míňaš v priemere najviac.`});let impulses=all.filter(x=>x.mood==='impulse');if(impulses.length>=3)out.push({icon:'⚡',title:'Impulz',text:`Impulzívne nákupy tvoria ${Math.round(impulses.reduce((a,x)=>a+x.amount,0)/all.reduce((a,x)=>a+x.amount,0)*100)} % tvojich výdavkov.`});let rewards=all.filter(x=>x.mood==='reward');if(rewards.length>=3)out.push({icon:'🎁',title:'Odmena',text:`Na výdavky označené „Odmena“ si dala ${euro(rewards.reduce((a,x)=>a+x.amount,0))}.`});let weekends=all.filter(x=>[0,6].includes(new Date(x.date+'T12:00').getDay())),work=all.filter(x=>![0,6].includes(new Date(x.date+'T12:00').getDay()));if(weekends.length>=3&&work.length>=3){let wa=weekends.reduce((a,x)=>a+x.amount,0)/weekends.length,da=work.reduce((a,x)=>a+x.amount,0)/work.length;if(wa>da*1.25)out.push({icon:'🎉',title:'Víkend',text:`Cez víkend míňaš na jednu transakciu približne ${Math.round((wa/da-1)*100)} % viac.`})}return out.slice(0,4)}
function cashLeaks(){let map={};Object.values(s.months).forEach(m=>(m.expenses||[]).forEach(x=>{let key=(x.note||x.subcat||C(x.cat)?.name||'').trim().toLowerCase();if(!key)return;map[key]=map[key]||{name:x.note||x.subcat||C(x.cat)?.name,count:0,total:0,cat:x.cat};map[key].count++;map[key].total+=x.amount}));return Object.values(map).filter(x=>x.count>=3&&x.total>=10).sort((a,b)=>b.count-a.count||b.total-a.total).slice(0,5)}
function summaryView(){let tc=topCats(),be=biggestExpense(),bd=biggestDay(),cmp=comparison(),p=projection(),dir=cmp.diff>0?'viac':'menej',cls=cmp.diff>0?'red':'green',ins=smartInsights(),changes=categoryChanges(),tr=spendingTriggers(),leaks=cashLeaks();$('overviewBody').innerHTML=`<div class="card"><div style="height:245px"><canvas id="pie" width="320" height="245"></canvas></div><div id="legend" class="legend"></div><div class="row"><b>Variabilné výdavky SPOLU</b><b>${euro(varSpent())}</b></div></div><div class="insightsList">${ins.map(x=>`<div class="smartInsight"><div class="siIcon">${x.icon}</div><div><b>${esc(x.title)}</b><div class="small muted">${esc(x.text)}</div></div></div>`).join('')}</div><div class="title">Prečo míňam?</div>${moodSummaryHTML()}<div class="title">Spending triggers</div><div class="triggerGrid">${tr.map(x=>`<div class="trigger"><div class="triggerIcon">${x.icon}</div><div><b>${esc(x.title)}</b><div class="small muted">${esc(x.text)}</div></div></div>`).join('')}</div>${leaks.length?`<div class="title">💧 Cash Leak</div><div class="card">${leaks.map(x=>`<div class="cashLeak"><div><b>${esc(x.name)}</b><div class="small muted">${x.count}× · malé opakované výdavky</div></div><div><b>${euro(x.total)}</b><button class="tiny" onclick="createLeakChallenge('${esc(x.name).replace(/'/g,"\\'")}')">Challenge</button></div></div>`).join('')}</div>`:''}<div class="metricgrid" style="margin-top:12px"><div class="metric"><span>Priemer / deň</span><b>${euro(avgDay())}</b></div><div class="metric"><span>Oproti minulému mesiacu</span><b class="${cls}">${cmp.b?`${Math.abs(cmp.pct).toFixed(0)} % ${dir}`:'—'}</b></div><div class="metric"><span>Najdrahší deň</span><b>${bd?euro(bd.amount):'—'}</b></div><div class="metric"><span>Najväčší výdavok</span><b>${be?euro(be.amount):'—'}</b></div></div><div class="title">Čo sa zmenilo?</div><div class="card">${changes.length?changes.map(x=>`<div class="row tx"><div class="cat">${ico(x.c)}<div><b>${esc(x.c.name)}</b></div>< function challengeProgress(ch){let by=expenseByDay(),today=todayISO();if(ch.type==='nospend'){let n=0;for(let d=1;d<=Math.min(dayProgress(),daysInMonth());d++){let ds=K()+'-'+String(d).padStart(2,'0');if(!by[ds])n++}return [Math.min(ch.target,n),ch.target]}if(ch.type==='saved'){let ok=s.cats.filter(c=>c.type==='fixed'&&c.bucket==='saved').every(c=>M().savedChecks[c.id]);return [ok?1:0,1]}if(ch.type==='limits'||ch.type==='categoryboss'){let ok=s.cats.filter(c=>c.type==='variable'&&c.limit).every(c=>spent(c.id)<=c.limit);return [ok?1:0,1]}if(ch.type==='beat'){return [comparison().b&&varSpent()<comparison().b?1:0,1]}return [0,ch.target||1]}
function totalXP(){let xp=0;CHALLENGES.forEach(ch=>{let [a,b]=challengeProgress(ch);if(a>=b)xp+=ch.xp});Object.values(s.challengeState).forEach(c=>{if(c.complete)xp+=100});return xp}
function levelInfo(){let xp=totalXP(),levels=[[0,'Broke-ish'],[300,'Getting It Together'],[700,'Money Boss'],[1200,'Budget Bitch'],[2000,'Work Bitch 👑']],idx=0;levels.forEach((l,i)=>{if(xp>=l[0])idx=i});let cur=levels[idx],next=levels[idx+1];return {xp,name:cur[1],next:next?next[0]:cur[0]+1000,pct:next?Math.min(100,(xp-cur[0])/(next[0]-cur[0])*100):100}}
function challengesView(){let l=levelInfo(),custom=Object.entries(s.challengeState).filter(([k,v])=>v.active);$('wishBody').innerHTML=`<div class="challengeCard"><div class="row"><div><span class="levelPill">LEVEL</span><h3 style="margin:6px 0">${esc(l.name)}</h3></div><b>${l.xp} XP</b></div><div class="progressTrack"><i style="width:${l.pct}%"></i></div></div>${CHALLENGES.map(ch=>{let [a,b]=challengeProgress(ch),pct=Math.min(100,a/b*100);return `<div class="challengeCard"><div class="row"><div><b>${ch.icon} ${esc(ch.name)}</b><div class="small muted">${esc(ch.desc)}</div></div><b>+${ch.xp} XP</b></div><div class="progressTrack"><i style="width:${pct}%"></i></div><div class="row small"><span>${a} / ${b}</span><span>${pct>=100?'✓ Splnené':''}</span></div></div>`}).join('')}${custom.map(([id,c])=>`<div class="challengeCard"><b>💖 ${esc(c.name||id)}</b><div class="small muted">Vlastná challenge pre wishlist / cash leak.</div><div class="progressTrack"><i style="width:${Math.min(100,(c.saved||0)/(c.target||1)*100)}%"></i></div></div>`).join('')}`}
function tagDetail(t){let all=[];Object.entries(s.months).forEach(([k,m])=>(m.expenses||[]).forEach(x=>{if((x.tags||[]).includes(t))all.push({...x,_month:k})}));let total=all.reduce((a,x)=>a+x.amount,0),cats={};all.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+x.amount);let trip=s.trips.find(x=>x.tag===t);modalOpen(`<div class="row"><h2>🏷️ ${esc(t)}</h2><button onclick="closeM()">✕</button></div><div class="metricgrid"><div class="metric"><span>Celkom</span><b>${euro(total)}</b></div><div class="metric"><span>Výdavkov</span><b>${all.length}</b></div></div><div class="sectioncap">Rozdelenie podľa kategórií</div><div class="card">${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([id,v])=>`<div class="row"><span>${C(id)?.icon||'•'} ${esc(C(id)?.name||'Bez kategórie')}</span><b>${euro(v)}</b></div>`).join('')}</div><button class="primary wide" onclick="${trip?`closeM();openTrip('${trip.id}')`:`setupTravel('${esc(t).replace(/'/g,"\\'")}')`}">${trip?'✈️ Otvoriť Travel Mode':'✈️ Zapnúť Travel Mode'}</button>`)}
function setupTravel(tag){modalOpen(`<div class="row"><h2>✈️ Travel Mode</h2><button onclick="closeM()">✕</button></div><label class="field">Názov cesty</label><input id="tn" class="input" value="${esc(tag)}"><label class="field">Od</label><input id="tf" class="input" type="date"><label class="field">Do</label><input id="tt" class="input" type="date"><label class="field">Môj travel budget</label><input id="tb" class="input" type="number"><label class="field">Spolucestujúci</label><input id="tp" class="input" value="Partner"><button class="primary wide" onclick="saveTrip('${esc(tag).replace(/'/g,"\\'")}')">Aktivovať Travel Mode</button>`)}
function saveTrip(tag){let t={id:'t'+Date.now(),tag,name:$('tn').value.trim()||tag,from:$('tf').value,to:$('tt').value,budget:+$('tb').value||0,partner:$('tp').value.trim()||'Partner',active:true,expenses:[]};s.trips.push(t);s.activeTripId=t.id;save();closeM();render();openTrip(t.id)}
function openActiveTrip(){let t=s.trips.find(x=>x.id===s.activeTripId);if(t)openTrip(t.id)}
function tripStats(t){let mine=t.expenses.filter(x=>x.payer==='me').reduce((a,x)=>a+x.amount,0),partner=t.expenses.filter(x=>x.payer==='partner').reduce((a,x)=>a+x.amount,0),joint=t.expenses.filter(x=>x.shared).reduce((a,x)=>a+x.amount,0);let myJoint=t.expenses.filter(x=>x.payer==='me'&&x.shared).reduce((a,x)=>a+x.amount,0),partnerJoint=t.expenses.filter(x=>x.payer==='partner'&&x.shared).reduce((a,x)=>a+x.amount,0),settle=(partnerJoint-myJoint)/2;return {mine,partner,total:mine+partner,joint,settle}}
function openTrip(id){let t=s.trips.find(x=>x.id===id);if(!t)return;let st=tripStats(t),days=t.from&&t.to?Math.max(1,Math.round((new Date(t.to)-new Date(t.from))/86400000)+1):1;modalOpen(`<div class="row"><h2>✈️ ${esc(t.name)}</h2><button onclick="closeM()">✕</button></div><div class="travelTotals"><div class="metric"><span>Ja</span><b>${euro(st.mine)}</b></div><div class="metric"><span>${esc(t.partner)}</span><b>${euro(st.partner)}</b></div><div class="metric"><span>Spolu</span><b>${euro(st.total)}</b></div></div><div class="metricgrid" style="margin-top:8px"><div class="metric"><span>Môj budget zostáva</span><b>${euro(t.budget-st.mine)}</b></div><div class="metric"><span>Na deň</span><b>${euro(Math.max(0,(t.budget-st.mine)/days))}</b></div></div><button class="primary wide" onclick="tripExpense('${id}')">+ Pridať travel výdavok</button><div class="title">Výdavky</div><div class="card">${t.expenses.map(x=>`<div class="row tx"><div><b>${x.payer==='me'?'Ja':esc(t.partner)} · ${esc(x.category)}</b><div class="small muted">${esc(x.note||'')}${x.shared?' · spoločné':''}</div></div><b>${euro(x.amount)}</b></div>`).join('')||'<div class="empty">Zatiaľ bez travel výdavkov.</div>'}</div><div class="forecast"><small>Vyrovnanie spoločných výdavkov</small><strong>${Math.abs(st.settle)<.01?'Ste vyrovnaní':st.settle>0?`Dlžíš ${esc(t.partner)} ${euro(st.settle)}`:`${esc(t.partner)} ti dlží ${euro(Math.abs(st.settle))}`}</strong></div><div class="filters"><button onclick="exportTripReport('${id}')">Export reportu</button><button onclick="t.active=false;s.activeTripId='';save();closeM();render()">Archivovať</button></div>`)}
function tripExpense(id){let t=s.trips.find(x=>x.id===id);modalOpen(`<div class="row"><h2>Travel výdavok</h2><button onclick="openTrip('${id}')">‹</button></div><label class="field">Suma</label><input id="tea" class="input" type="number"><label class="field">Kategória</label><select id="tec">${['Jedlo','Káva','Drink','Ubytovanie','Letenky','Doprava','Aktivity','Nákupy','Suveníry','Ostatné'].map(x=>`<option>${x}</option>`).join('')}</select><label class="field">Kto platil?</label><div class="whoRow"><button id="payMe" class="sel" onclick="this.classList.add('sel');$('payPartner').classList.remove('sel');this.parentElement.dataset.payer='me'">Ja</button><button id="payPartner" onclick="this.classList.add('sel');$('payMe').classList.remove('sel');this.parentElement.dataset.payer='partner'">${esc(t.partner)}</button></div><label style="display:flex;gap:8px;align-items:center;margin:12px 0"><input id="tes" type="checkbox"> Spoločný výdavok (50:50)</label><label class="field">Poznámka</label><input id="ten" class="input"><button class="primary wide" onclick="saveTripExpense('${id}')">Uložiť</button>`);document.querySelector('.whoRow').dataset.payer='me'}
function saveTripExpense(id){let t=s.trips.find(x=>x.id===id),a=+$('tea').value;if(!a)return alert('Zadaj platnú sumu.');t.expenses.push({id:'te'+Date.now(),amount:a,category:$('tec').value,payer:document.querySelector('.whoRow').dataset.payer||'me',shared:$('tes').checked,note:$('ten').value.trim(),date:todayISO()});save();openTrip(id)}
function exportTripReport(id){let t=s.trips.find(x=>x.id===id);if(t)printReport('Travel report: '+t.name,t.expenses.map(x=>({date:x.date,cat:x.category,note:(x.payer==='me'?'Ja':t.partner)+(x.shared?' · spoločné':'')+' '+x.note,amount:x.amount})))}
function editCat(id){let c=C(id);modalOpen(`<div class="row"><h2>Upraviť kategóriu</h2><button onclick="closeM()">✕</button></div><label class="field">Názov</label><input id="cn" class="input" value="${esc(c.name)}"><label class="field">Ikona / emoji</label><input id="ci" class="input" value="${esc(c.icon)}"><label class="field">Farba</label>${colorPicks(c.color)}<label class="field">Podkategórie</label><input id="cs" class="input" value="${esc((c.subcats||[]).join(', '))}"><label class="field">Mesačný limit / suma</label><input id="cl" class="input" type="number" value="${c.limit}"><label class="field">Typ</label><select id="ct"><option value="fixed" ${c.type==='fixed'?'selected':''}>Fixná</option><option value="variable" ${c.type==='variable'?'selected':''}>Variabilná</option></select><label class="field">Ako sa započítava</label><select id="cb"><option value="spent" ${c.bucket==='spent'?'selected':''}>Minuté / uhradené</option><option value="saved" ${c.bucket==='saved'?'selected':''}>Odkladané s checkboxom</option></select><div class="switchrow"><div><b>Skryť kategóriu</b><div class="small muted">História zostane zachovaná.</div></div><input id="chidden" type="checkbox" ${c.hidden?'checked':''}></div><div class="filters"><button class="primary" onclick="saveCat('${id}')">Uložiť</button><button class="danger" onclick="removeCat('${id}')">Vymazať</button></div>`)}

function settings(){let snaps=[...s.snapshots].reverse();$('app').innerHTML=`<div class="settingsHero">${logoHTML()}<div><div class="small muted">Tvoja money appka</div><b style="font-size:23px">Work Bitch</b><div class="tiny muted">verzia 12</div></div></div><div class="settingsGroup">💰 Rozpočet a peniaze</div><div class="card"><div class="settingItem"><b>Predvolený mesačný príjem</b><input class="input" type="number" value="${s.defaultIncome}" onchange="s.defaultIncome=+this.value||2000;save()"></div><div class="switchrow"><div><b>Automatické poradie kategórií</b><div class="small muted">Najpoužívanejšie kategórie budú hore.</div></div><input class="toggle" type="checkbox" ${s.autoCategoryOrder?'checked':''} onchange="s.autoCategoryOrder=this.checked;save();settings()"></div><div class="settingItem"><b>Kategórie, podkategórie a limity</b><div class="title" style="font-size:14px">Variabilné</div>${manageCats('variable')}<div class="title" style="font-size:14px">Fixné</div>${manageCats('fixed')}<button class="primary wide" onclick="newCat()">- Pridať kategóriu</button></div></div><div class="settingsGroup">🔐 Súkromie a zabezpečenie</div><div class="card"><div class="settingHead"><div class="settingIcon">🔒</div><div><b>PIN ochrana</b><div class="small muted">${s.pin?'Aktívna – appka je chránená PIN-om.':'PIN zatiaľ nie je nastavený.'}</div></div></div><div class="filters"><button onclick="setPin()">${s.pin?'Zmeniť PIN':'Nastaviť PIN'}</button>${s.pin?'<button class="danger" onclick="removePin()">Vypnúť PIN</button>':'<span></span>'}</div>${s.pin?`<label class="field">Automatické zamknutie</label><select onchange="s.lockAfter=this.value==='never'?'never':+this.value;save(false)"><option value="0" ${s.lockAfter===0?'selected':''}>Ihneď po opustení appky</option><option value="60" ${s.lockAfter===60?'selected':''}>Po 1 minúte</option><option value="300" ${s.lockAfter===300?'selected':''}>Po 5 minútach</option><option value="never" ${s.lockAfter==='never'?'selected':''}> function exportExcelReport(){let rows=reportRows('year'),escx=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),sheet=(name,headers,data)=>`<Worksheet ss:Name="${escx(name)}"><Table><Row>${headers.map(h=>`<Cell><Data ss:Type="String">${escx(h)}</Data></Cell>`).join('')}</Row>${data.map(r=>`<Row>${r.map((v,i)=>`<Cell><Data ss:Type="${typeof v==='number'?'Number':'String'}">${escx(v)}</Data></Cell>`).join('')}</Row>`).join('')}</Table></Worksheet>`,summary=[['Príjem',M().income],['Minuté',totalSpent()],['Odložené',saved()],['Zostatok',remaining()]],xml=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${sheet('Súhrn',['Položka','Hodnota'],summary)}${sheet('Výdavky',['Dátum','Kategória','Podkategória','Poznámka','Tagy','Mood','Suma'],rows.map(x=>[x.date,x.cat,x.sub,x.note,x.tags,x.mood,x.amount]))}${sheet('Kategórie',['Názov','Typ','Limit','Skrytá'],s.cats.map(c=>[c.name,c.type,c.limit,c.hidden?'Áno':'Nie']))}</Workbook>`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([xml],{type:'application/vnd.ms-excel'}));a.download='work-bitch-report-'+todayISO()+'.xls';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),700);toastMsg('Excel report vytvorený')}
function applyAppearance(){let dark=s.appearance==='dark'||(s.appearance==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.body.dataset.dark=dark?'1':'0';document.body.dataset.theme=s.theme||'work';document.documentElement.style.colorScheme=dark?'dark':'light'}

function challengeProgress(ch){let by=expenseByDay(),today=todayISO(),maxd=Math.min(dayProgress(),daysInMonth());function hasOn(ds,pred){return (M().expenses||[]).some(x=>x.date===ds&&pred(x))}function streakWithout(pred,target){let n=0;for(let d=maxd;d>=1;d--){let ds=K()+'-'+String(d).padStart(2,'0');if(hasOn(ds,pred))break;n++;if(n>=target)break}return Math.min(n,target)}if(ch.type==='nospend'){let n=0;for(let d=1;d<=maxd;d++){let ds=K()+'-'+String(d).padStart(2,'0');if(!by[ds])n++}return [Math.min(ch.target,n),ch.target]}if(ch.type==='saved'){let ok=s.cats.filter(c=>c.type==='fixed'&&c.bucket==='saved').every(c=>M().savedChecks[c.id]);return [ok?1:0,1]}if(ch.type==='limits'){let ok=s.cats.filter(c=>c.type==='variable'&&c.limit).every(c=>spent(c.id)<=c.limit);return [ok?1:0,1]}if(ch.type==='beat'){return [comparison().b&&varSpent()<comparison().b?1:0,1]}if(ch.type==='subcatfree'){let re=new RegExp(ch.sub,'i');return [streakWithout(x=>re.test(x.subcat||''),ch.target),ch.target]}if(ch.type==='catfree'){let c=s.cats.find(c=>c.name.toLowerCase().includes(ch.catName.toLowerCase()));return [c?streakWithout(x=>x.cat===c.id,ch.target):0,ch.target]}if(ch.type==='weekend'){for(let d=1;d<=maxd;d++){let dt=new Date(cur.getFullYear(),cur.getMonth(),d);if(dt.getDay()===0&&d>=2){let sat=K()+'-'+String(d-1).padStart(2,'0'),sun=K()+'-'+String(d).padStart(2,'0');if(!by[sat]&&!by[sun])return [1,1]}}return [0,1]}if(ch.type==='funweekend'){let fun=s.cats.find(c=>c.name.toLowerCase().includes('zábav'));for(let d=1;d<=maxd;d++){let dt=new Date(cur.getFullYear(),cur.getMonth(),d);if(dt.getDay()===0&&d>=3){let dates=[d-2,d-1,d].map(n=>K()+'-'+String(n).padStart(2,'0'));if(dates.every(ds=>!hasOn(ds,x=>x.cat===fun?.id)))return [1,1]}}return [0,1]}if(ch.type==='pace'){let safe=Math.max(1,safeAvailable()/Math.max(1,daysLeft())),n=0;for(let d=maxd;d>=1&&n<7;d--){let ds=K()+'-'+String(d).padStart(2,'0'),sum=(M().expenses||[]).filter(x=>x.date===ds).reduce((a,x)=>a+x.amount,0);if(sum>safe)break;n++}return [n,7]}return [0,ch.target||1]}
function addCustomProgress(id){let c=s.challengeState[id];if(!c)return;let v=+prompt('Koľko si vedome ušetrila pre túto challenge?')||0;if(v<=0)return;c.saved=(c.saved||0)+v;if(c.target&&c.saved>=c.target)c.complete=true;save();challengesView()}
function challengesView(){let l=levelInfo(),custom=Object.entries(s.challengeState).filter(([k,v])=>v.active);$('wishBody').innerHTML=`<div class="challengeCard"><div class="row"><div><span class="levelPill">LEVEL</span><h3 style="margin:6px 0">${esc(l.name)}</h3></div><b>${l.xp} XP</b></div><div class="progressTrack"><i style="width:${l.pct}%"></i></div></div>${CHALLENGES.map(ch=>{let [a,b]=challengeProgress(ch),pct=Math.min(100,a/b*100);return `<div class="challengeCard"><div class="row"><div><b>${ch.icon} ${esc(ch.name)}</b><div class="small muted">${esc(ch.desc)}</div></div><b>+${ch.xp} XP</b></div><div class="progressTrack"><i style="width:${pct}%"></i></div><div class="row small"><span>${a} / ${b}</span><span>${pct>=100?'✓ Splnené':''}</span></div></div>`}).join('')}${custom.map(([id,c])=>{let pct=Math.min(100,(c.saved||0)/(c.target||1)*100);return `<div class="challengeCard"><div class="row"><div><b>${id.startsWith('wish:')?'💖':'💧'} ${esc(c.name||id)}</b><div class="small muted">${id.startsWith('wish:')?'Šetri smerom k wishlist cieľu.':'Leak Killer – zníž opakované míňanie.'}</div></div><b>${Math.round(pct)} %</b></div><div class="progressTrack"><i style="width:${pct}%"></i></div>${id.startsWith('wish:')?`<button class="ghost wide" onclick="addCustomProgress('${id}')">+ Pridať ušetrenú sumu</button>`:''}</div>`}).join('')}`}
function tripExpense(id){let t=s.trips.find(x=>x.id===id),v=activeCats('variable');modalOpen(`<div class="row"><h2>Travel výdavok</h2><button onclick="openTrip('${id}')">‹</button></div><label class="field">Suma</label><input id="tea" class="input" type="number"><label class="field">Travel kategória</label><select id="tec">${['Jedlo','Káva','Drink','Ubytovanie','Letenky','Doprava','Aktivity','Nákupy','Suveníry','Ostatné'].map(x=>`<option>${x}</option>`).join('')}</select><label class="field">Kto platil?</label><div class="whoRow" data-payer="me"><button id="payMe" class="sel" onclick="this.classList.add('sel');$('payPartner').classList.remove('sel');this.parentElement.dataset.payer='me';$('normalCatWrap').style.display='block'">Ja</button><button id="payPartner" onclick="this.classList.add('sel');$('payMe').classList.remove('sel');this.parentElement.dataset.payer='partner';$('normalCatWrap').style.display='none'">${esc(t.partner)}</button></div><div id="normalCatWrap"><label class="field">Moja budget kategória</label><select id="tenormal">${v.map(c=>`<option value="${c.id}">${c.icon} ${esc(c.name)}</option>`).join('')}</select><div class="tiny muted">Ak platíš ty, výdavok sa započíta aj do tvojho mesačného budgetu.</div></div><label style="display:flex;gap:8px;align-items:center;margin:12px 0"><input id="tes" type="checkbox"> Spoločný výdavok (50:50)</label><label class="field">Poznámka</label><input id="ten" class="input"><button class="primary wide" onclick="saveTripExpense('${id}')">Uložiť</button>`)}
function saveTripExpense(id){let t=s.trips.find(x=>x.id===id),a=+$('tea').value;if(!a)return alert('Zadaj platnú sumu.');let payer=document.querySelector('.whoRow').dataset.payer||'me',note=$('ten').value.trim(),date=t.from&&t.to&&todayISO()>=t.from&&todayISO()<=t.to?todayISO():todayISO(),travel={id:'te'+Date.now(),amount:a,category:$('tec').value,payer,shared:$('tes').checked,note,date};t.expenses.push(travel);if(payer==='me'){let key=date.slice(0,7),cat=$('tenormal')?.value||activeCats('variable')[0]?.id;M(key).expenses.push({id:'e'+Date.now(),amount:a,cat,subcat:'',date,note:note||`${t.name}: ${travel.category}`,tags:[t.tag],mood:'experience',time:new Date().toTimeString().slice(0,5),travelId:travel.id,ts:Date.now()});if(!s.tags.includes(t.tag))s.tags.push(t.tag)}save();openTrip(id)}
function buyWish(id){let w=s.wishlist.find(x=>x.id===id);if(!w)return;if(confirm('Označiť ako kúpené a pridať ako výdavok?')){w.bought=true;save();closeM();openExpense('',w.name,w.price,'')}else{w.bought=true;save();wishlist()}}
function moodStats(){let map={};M().expenses.forEach(x=>{if(!x.mood)return;map[x.mood]=map[x.mood]||{count:0,total:0};map[x.mood].count++;map[x.mood].total+=x.amount});return map}
function moodSummaryHTML(){let st=moodStats(),entries=Object.entries(st).sort((a,b)=>b[1].total-a[1].total),tot=entries.reduce((a,[,v])=>a+v.total,0);if(!entries.length)return '<div class="card empty">Mood tagy sa začnú zobrazovať, keď ich použiješ pri výdavkoch.</div>';return `<div class="card">${entries.map(([id,v])=>`<div class="row tx"><span>${moodLabel(id)}</span><div style="text-align:right"><b>${euro(v.total)}</b><div class="tiny muted">${tot?Math.round(v.total/tot*100):0}%</div></div></div>`).join('')}</div>`}
function editExpense(id,key){let f=findExpense(id,key);if(!f)return;let x=f.x,v=s.cats.filter(q=>q.type==='variable'&&(!q.hidden||q.id===x.cat));modalOpen(`<div class="row"><h2>Upraviť výdavok</h2><button onclick="closeM()">✕</button></div><label class="field">Suma</label><input id="xa" class="input" type="number" step=".01" value="${x.amount}"><label class="field">Kategória</label><select id="xc" onchange="refreshSubcat('xc','xs')">${v.map(q=>`<option value="${q.id}" ${q.id===x.cat?'selected':''}>${q.icon} ${esc(q.name)}</option>`).join('')}</select><label class="field">Podkategória</label><select id="xs">${subcatOptions(x.cat,x.subcat||'')}</select><label class="field">Dátum</label><input id="xd" class="input" type="date" value="${x.date}"><label class="field">Poznámka</label><input id="xn" class="input" value="${esc(x.note||'')}"><label class="field">Tagy</label><div>${tagOptions(x.tags||[])}</div><label class="field">Prečo míňam?</label><div id="moodPick" data-value="${x.mood||''}">${moodOptions(x.mood||'')}</div><div class="filters"><button class="primary" onclick="updateExpense('${id}','${key}')">Uložiť</button><button class="repeatBtn" onclick="repeatExpense('${id}','${key}')">↻ Zopakovať</button></div><button class="danger wide" onclick="deleteExpense('${id}','${key}')">Vymazať</button>`)}
