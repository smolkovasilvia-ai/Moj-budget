function drawPie(){let cv=$('pie');if(!cv)return;let ctx=cv.getContext('2d'),v=s.cats.filter(c=>c.type==='variable'),vals=v.map(c=>spent(c.id)),tot=vals.reduce((a,b)=>a+b,0),cx=160,cy=112,r=92,inner=54;ctx.clearRect(0,0,320,245);if(!tot){ctx.fillStyle='#777';ctx.textAlign='center';ctx.font='14px -apple-system';ctx.fillText('Zatiaľ bez výdavkov',160,115);return}let st=-Math.PI/2;vals.forEach((x,i)=>{if(!x)return;let en=st+x/tot*Math.PI*2;ctx.beginPath();ctx.arc(cx,cy,r,st,en);ctx.arc(cx,cy,inner,en,st,true);ctx.closePath();ctx.fillStyle=v[i].color;ctx.fill();st=en});ctx.fillStyle='#17171d';ctx.textAlign='center';ctx.font='700 20px -apple-system';ctx.fillText(euro(tot),cx,cy+3);ctx.fillStyle='#777';ctx.font='11px -apple-system';ctx.fillText('variabilné',cx,cy+20);$('legend').innerHTML=v.filter(c=>spent(c.id)>0).map(c=>`<button class="pill" style="background:${c.color}30" onclick="filter='${c.id}';overviewSection='transactions';overview()">${c.icon} ${esc(c.name)}</button>`).join('')}

function deleteExpense(id,key){let f=findExpense(id,key);if(!f)return;let arr=M(f.key).expenses,i=arr.findIndex(x=>x.id===id);if(i<0)return;if(confirm('Naozaj vymazať tento výdavok?')){lastDeleted={month:f.key,item:arr[i],index:i};arr.splice(i,1);save();closeM();render();$('undo').classList.add('show');setTimeout(()=>$('undo').classList.remove('show'),5000)}}
function undoDelete(){if(!lastDeleted)return;M(lastDeleted.month).expenses.splice(lastDeleted.index,0,lastDeleted.item);lastDeleted=null;save();$('undo').classList.remove('show');render();toastMsg('Výdavok obnovený')}
function editIncome(){modalOpen(`<div class="row"><h2>Upraviť príjem</h2><button onclick="closeM()">✕</button></div><div class="notice">Zmena platí len pre ${label()}.</div><input id="inc" class="input" type="number" value="${M().income}"><button class="primary wide" onclick="M().income=+$('inc').value||0;save();closeM();render()">Uložiť</button>`)}function colorPicks(sel){return `<div class="colorgrid">${COLORS.map(c=>`<button class="colorpick ${c===sel?'sel':''}" style="background:${c}" onclick="document.querySelectorAll('.colorpick').forEach(x=>x.classList.remove('sel'));this.classList.add('sel');this.dataset.pick='1'" data-color="${c}"></button>`).join('')}</div>`}function chosenColor(def){return document.querySelector('.colorpick.sel')?.dataset.color||def}
function editCat(id){let c=C(id);modalOpen(`<div class="row"><h2>Upraviť kategóriu</h2><button onclick="closeM()">✕</button></div><label class="field">Názov</label><input id="cn" class="input" value="${esc(c.name)}"><label class="field">Ikona / emoji</label><input id="ci" class="input" value="${esc(c.icon)}"><label class="field">Farba</label>${colorPicks(c.color)}<label class="field">Podkategórie</label><input id="cs" class="input" value="${esc((c.subcats||[]).join(', '))}" placeholder="napr. Potraviny, Reštaurácie, Káva"><div class="tiny muted">Oddeľ čiarkou. Pri výdavku si potom vyberieš konkrétnu podkategóriu.</div><label class="field">Mesačný limit / suma</label><input id="cl" class="input" type="number" value="${c.limit}"><label class="field">Typ</label><select id="ct"><option value="fixed" ${c.type==='fixed'?'selected':''}>Fixná</option><option value="variable" ${c.type==='variable'?'selected':''}>Variabilná</option></select><label class="field">Ako sa započítava</label><select id="cb"><option value="spent" ${c.bucket==='spent'?'selected':''}>Minuté / uhradené</option><option value="saved" ${c.bucket==='saved'?'selected':''}>Odkladané s checkboxom</option></select><div class="filters"><button class="primary" onclick="saveCat('${id}')">Uložiť</button><button class="danger" onclick="removeCat('${id}')">Vymazať</button></div>`)}function saveCat(id){let c=C(id);c.name=$('cn').value.trim()||c.name;c.icon=$('ci').value.trim()||'•';c.color=chosenColor(c.color);c.subcats=$('cs').value.split(',').map(x=>x.trim()).filter(Boolean);c.limit=+$('cl').value||0;c.type=$('ct').value;c.bucket=$('cb').value;if(c.type==='variable')c.bucket='spent';save();closeM();render()}function newCat(){modalOpen(`<div class="row"><h2>Nová kategória</h2><button onclick="closeM()">✕</button></div><label class="field">Názov</label><input id="nn" class="input" placeholder="Napr. Oblečenie"><label class="field">Ikona / emoji</label><input id="ni" class="input" placeholder="👗"><label class="field">Farba</label>${colorPicks(COLORS[0])}<label class="field">Podkategórie</label><input id="ns" class="input" placeholder="napr. Potraviny, Reštaurácie, Káva"><div class="tiny muted">Voliteľné, oddeľ čiarkou.</div><label class="field">Mesačný limit / suma</label><input id="nl" class="input" type="number" placeholder="0"><label class="field">Typ</label><select id="nt"><option value="variable">Variabilná</option><option value="fixed">Fixná</option></select><label class="field">Fixná položka</label><select id="nb"><option value="spent">Bežne uhradená</option><option value="saved">Odkladaná s checkboxom</option></select><button class="primary wide" onclick="addCat()">Pridať kategóriu</button>`)}function addCat(){if(!$('nn').value.trim())return alert('Zadaj názov.');let type=$('nt').value;s.cats.push({id:'c'+Date.now(),name:$('nn').value.trim(),icon:$('ni').value.trim()||'•',color:chosenColor(COLORS[0]),subcats:$('ns').value.split(',').map(x=>x.trim()).filter(Boolean),limit:+$('nl').value||0,type,bucket:type==='variable'?'spent':$('nb').value});save();closeM();render()}function removeCat(id){if(Object.values(s.months).some(m=>(m.expenses||[]).some(x=>x.cat===id)))return alert('Táto kategória má výdavky. Najprv ich presuň do inej kategórie.');if(confirm('Naozaj vymazať kategóriu?')){s.cats=s.cats.filter(c=>c.id!==id);save();closeM();render()}}function moveCat(id,dir){let idx=s.cats.findIndex(c=>c.id===id),c=s.cats[idx],same=s.cats.map((x,i)=>({x,i})).filter(o=>o.x.type===c.type),pos=same.findIndex(o=>o.x.id===id),target=same[pos+dir];if(!target)return;[s.cats[idx],s.cats[target.i]]=[s.cats[target.i],s.cats[idx]];save();settings()}
function backup(){makeSnapshot('manual');let b=new Blob([JSON.stringify(cleanState(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='moj-budget-zaloha-'+todayISO()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toastMsg('Záloha exportovaná')}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(!o.cats||!o.months)throw 0;if(confirm('Import nahradí aktuálne dáta. Pokračovať?')){makeSnapshot('manual');s=o;s.snapshots=s.snapshots||[];s.tags=s.tags||[];s.lockAfter=s.lockAfter??0;s.cats.forEach((c,i)=>c.color=c.color||COLORS[i%COLORS.length]);save(false);render();alert('Záloha obnovená.')}}catch(_){alert('Neplatná záloha.')}};r.readAsText(f);e.target.value=''}function restoreSnapshot(id){let q=s.snapshots.find(x=>x.id===id);if(!q)return;if(confirm('Obnoviť tento stav? Aktuálny stav sa najprv uloží ako záloha.')){let keep=[...s.snapshots];try{let o=JSON.parse(q.data);makeSnapshot('manual');let newest=[...s.snapshots];s=o;s.snapshots=newest.slice(-5);save(false);render();toastMsg('Stav obnovený')}catch(_){s.snapshots=keep;alert('Zálohu sa nepodarilo obnoviť.')}}}
function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"'}function exportCSV(){let rows=[['Dátum','Kategória','Poznámka','Tagy','Suma']];Object.entries(s.months).sort().forEach(([k,m])=>(m.expenses||[]).forEach(x=>rows.push([x.date,C(x.cat)?.name||'Bez kategórie',x.note||'',(x.tags||[]).join('; '),x.amount])));let csv='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='moj-budget-vydavky-'+todayISO()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toastMsg('CSV exportované')}
function setPin(){let p=prompt('Zadaj nový 4-miestny PIN:');if(p===null)return;if(!/^\d{4}$/.test(p))return alert('PIN musí mať presne 4 číslice.');let p2=prompt('Zopakuj nový PIN:');if(p2!==p)return alert('PINy sa nezhodujú. Skús to znova.');s.pin=p;s.lockAfter=s.lockAfter??0;pinBuffer='';save();alert('PIN bol uložený.')}function removePin(){let p=prompt('Pre vypnutie zadaj aktuálny PIN:');if(p!==s.pin)return alert('Nesprávny PIN.');s.pin='';pinBuffer='';save();$('lock').classList.remove('show');render()}function keypadBuild(){$('keypad').innerHTML=[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button onclick="pinKey('${k}')">${k}</button>`).join('')}function pinKey(k){if(k==='⌫')pinBuffer=pinBuffer.slice(0,-1);else if(k==='✓')checkPin();else if(pinBuffer.length<4){pinBuffer+=String(k);if(pinBuffer.length===4)setTimeout(checkPin,100)}$('pinDots').textContent='●'.repeat(pinBuffer.length)+'○'.repeat(4-pinBuffer.length)}function checkPin(){if(pinBuffer===String(s.pin)){$('lock').classList.remove('show');$('pinMsg').textContent='';pinBuffer='';sessionStorage.setItem('mb-unlocked','1')}else{$('pinMsg').textContent='Nesprávny PIN';pinBuffer='';$('pinDots').textContent='○○○○'}}function lockNow(){if(!s.pin)return;keypadBuild();pinBuffer='';$('pinDots').textContent='○○○○';$('pinMsg').textContent='';$('lock').classList.add('show');sessionStorage.removeItem('mb-unlocked')}function startLock(){if(s.pin&&sessionStorage.getItem('mb-unlocked')!=='1')lockNow()}document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now()}else if(s.pin&&s.lockAfter!=='never'){let sec=(Date.now()-hiddenAt)/1000;if(s.lockAfter===0||sec>=Number(s.lockAfter))lockNow()}});
function toastMsg(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}
render();startLock();
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=91').catch(()=>{});}</script></body></html>
